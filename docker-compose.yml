services:
  postgres:
    image: postgres:16-alpine
    container_name: subpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subpilot
      POSTGRES_USER: subpilot
      POSTGRES_PASSWORD: subpilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - subpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subpilot -d subpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: subpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - subpilot_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  subpilot_postgres_data:
  subpilot_redis_data:
